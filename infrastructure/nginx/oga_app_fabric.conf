# OGA LMS Enterprise Application Fabric Reverse Proxy
server {
    listen 80;
    server_name lms.ogacounselingcenter.com *.ogacounselingcenter.com;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Frontend Next.js Proxy
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Asynchronous Compliance API & Python Matrix Proxy
    location /api/compliance/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static Public Assets
    location /public/ {
        alias /home/ec2-user/ourgray/public/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
